<g font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="15">
<text x="28" y="74" xml:space="preserve"><tspan fill="#ff8a5c">~/projects</tspan><tspan fill="#7ee787" font-weight="700"> ❯ </tspan><tspan fill="#d7dce6">ferrodo --features</tspan></text>
<text x="34" y="110" xml:space="preserve"><tspan fill="#5ce1e6" font-weight="700">▌</tspan></text>
<text x="74" y="110" xml:space="preserve"><tspan fill="#d7dce6" font-weight="700">Full-screen app</tspan></text>
<text x="278" y="110" xml:space="preserve"><tspan fill="#8b93a7">keyboard-driven, built with ratatui</tspan></text>
<text x="34" y="140" xml:space="preserve"><tspan fill="#f2cc60" font-weight="700">◷</tspan></text>
<text x="74" y="140" xml:space="preserve"><tspan fill="#d7dce6" font-weight="700">Natural due dates</tspan></text>
<text x="278" y="140" xml:space="preserve"><tspan fill="#8b93a7">today · fri · 3d · 2w · dec 24 · 2026-12-24</tspan></text>
<text x="34" y="170" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="700">!</tspan></text>
<text x="74" y="170" xml:space="preserve"><tspan fill="#d7dce6" font-weight="700">Smart order</tspan></text>
<text x="278" y="170" xml:space="preserve"><tspan fill="#8b93a7">overdue and due-today first, then by priority</tspan></text>
<text x="34" y="200" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="700">!!</tspan></text>
<text x="74" y="200" xml:space="preserve"><tspan fill="#d7dce6" font-weight="700">Priorities</tspan></text>
<text x="278" y="200" xml:space="preserve"><tspan fill="#8b93a7">high, medium and low, changed with + and -</tspan></text>
<text x="34" y="230" xml:space="preserve"><tspan fill="#7ee787" font-weight="700">✔</tspan></text>
<text x="74" y="230" xml:space="preserve"><tspan fill="#d7dce6" font-weight="700">Saved instantly</tspan></text>
<text x="278" y="230" xml:space="preserve"><tspan fill="#8b93a7">safe writes, so a crash never corrupts your list</tspan></text>
<text x="34" y="260" xml:space="preserve"><tspan fill="#ff8a5c" font-weight="700">$</tspan></text>
<text x="74" y="260" xml:space="preserve"><tspan fill="#d7dce6" font-weight="700">Scriptable</tspan></text>
<text x="278" y="260" xml:space="preserve"><tspan fill="#8b93a7">every action also works as a one-line command</tspan></text>
</g>
</svg>
